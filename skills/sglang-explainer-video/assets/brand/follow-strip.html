  It has two parts, both fixed in place:

  - #fs-links (y 652–768): this video's own links. Row 1 is the source the video explains (a file or
    directory in an sgl-project repository); row 2 is the cookbook or docs page a viewer would open next.
    Replace the two example URLs with the ones the frame packet gives you, and set row 2's label to
    「Cookbook」 or 「文档」 to match. Write each URL without "https://". A URL longer than 112 characters
    does not fit the row: link the containing directory instead.
  - #fs-follow (y 792–872): the fixed follow strip. Do not edit its text or URLs.

  How to use it:
  - Paste the CSS rules into the frame's own style element (inside #root, frame contract) and the two
    divs inside #root, after the frame's own content.
  - Layout: end the frame's own content above y≈630.
  - Timing: the strip is on from the start of the frame. Reveal the links card by the start of the frame's
    last clause and keep both on screen until the frame ends (the last voice line has a 2 s hold):
      tl.fromTo("#fs-follow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#fs-links", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, T);
  - Do not narrate either part. check_frames.mjs fails a last frame without them.
-->
